apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-operators
spec:
  generators:
  - list:
      elements:
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: openshift-gitops-operator
          path: components/operators/openshift-gitops/aggregate/overlays/default
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: openshift-ai-operator
          path: components/operators/openshift-ai/aggregate/overlays/stable-bm-nvidia-gpu
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: cert-manager-operator
          path: components/operators/cert-manager/aggregate/overlays/default
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: connectivity-link-operator
          path: components/operators/redhat-connectivity-link/aggregate/overlays/auth
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: leader-worker-set-operator
          path: components/operators/leader-worker-set/aggregate/overlays/default