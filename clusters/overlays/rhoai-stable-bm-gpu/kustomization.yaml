apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops

resources:
  - ../../../components/argocd/apps/overlays/rhoai-stable-bm-gpu
  - ../../base

configMapGenerator:
  - name: gitops-repo-config
    literals:
      - repoURL=https://github.com/rh-cpranava/ai-accelerator.git
      - targetRevision=main

replacements:
  # copy the repo from the application to the applicationsets
  - source:
      kind: ConfigMap
      fieldPath: data.repoURL
      name: gitops-repo-config
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.template.spec.source.repoURL
  # copy the branch from the application to the applicationsets
  - source:
      kind: ConfigMap
      fieldPath: data.targetRevision
      name: gitops-repo-config
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: ApplicationSet
        fieldPaths:
          - spec.template.spec.source.targetRevision
